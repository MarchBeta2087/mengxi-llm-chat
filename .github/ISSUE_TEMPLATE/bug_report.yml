name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请勿在下方粘贴**真实 API Key、主口令或恢复码**，一律脱敏为 `sk-xxxx…xxxx`。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 以普通用户登录
        2. 打开「我的 Key」...
        3. 观察到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Commit
      placeholder: v1.0.0 或 commit hash
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker Compose
        - 本地开发（uvicorn + vite）
        - Kubernetes
        - 其它
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 聊天 / SSE
        - 密钥管理 / 调度
        - 限流 / 配额
        - 插件系统
        - 对话加密 / 搜索
        - 管理后台
        - 前端界面 / 深色模式
        - 部署 / CI
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 后端日志、浏览器控制台或截图（请先脱敏）
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，未发现重复
          required: true
        - label: 我已移除所有敏感信息（密钥/口令/恢复码）
          required: true
