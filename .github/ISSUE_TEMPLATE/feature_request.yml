name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 请先描述「问题/场景」，再给出方案，便于评估。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前有什么不便？谁会遇到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的交互/行为；如涉及界面可附草图
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 聊天 / SSE
        - 密钥管理 / 调度
        - 限流 / 配额
        - 插件系统
        - 对话加密 / 搜索
        - 管理后台
        - 前端界面
        - 部署 / CI
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，未发现重复
          required: true
