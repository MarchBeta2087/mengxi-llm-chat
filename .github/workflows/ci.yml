name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 每日定时全量运行（含安全扫描与 Compose 冒烟）
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest + license + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest -q

      - name: Dependency license scan (no GPL/AGPL)
        run: pip-licenses --order=license --fail-on "GNU General Public License;GNU Affero General Public License"

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit

  frontend:
    name: Frontend (audit + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability audit (pnpm audit)
        run: pnpm audit --audit-level high

      - name: Unit tests + coverage gate (vitest)
        run: pnpm test:coverage

      - name: Build (vite)
        run: pnpm build

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (vite)
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report
          retention-days: 7

  compose-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Run compose smoke test
        run: bash src/deploy/smoke.sh

  trivy:
    name: Image vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          load: true
          tags: mengxi-backend:scan

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          load: true
          tags: mengxi-frontend:scan

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mengxi-backend:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mengxi-frontend:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  k8s:
    name: K8s manifests (kustomize build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: imranismail/setup-kustomize@v2

      - name: Render production overlay
        run: kustomize build deploy/k8s/overlays/production > /dev/null

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Generate backend SBOM (CycloneDX)
        working-directory: src/backend
        run: |
          pip install -r requirements.txt
          pip install cyclonedx-bom
          cyclonedx-py environment --output-format JSON -o ../../sbom-backend.cdx.json

      - name: Generate frontend SBOM (CycloneDX via Syft)
        uses: anchore/sbom-action@v0
        with:
          path: src/frontend
          format: cyclonedx-json
          output-file: sbom-frontend.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json
          if-no-files-found: error
