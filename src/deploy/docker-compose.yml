name: mengxi

services:
  # 数据库迁移（一次性）：执行 Alembic 后退出
  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ../backend/.env
    environment:
      MENGXI_DATABASE_URL: postgresql+asyncpg://mengxi:mengxi@postgres:5432/mengxi
      MENGXI_DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      MENGXI_DATABASE_URL: postgresql+asyncpg://mengxi:mengxi@postgres:5432/mengxi
      MENGXI_REDIS_URL: redis://redis:6379/0
      MENGXI_DATA_DIR: /data
    volumes:
      # KEK/DEK 密文与插件包（plugins 子目录）
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # 前端 + 反向代理（托管 SPA，/api 反代到 app）
  web:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mengxi
      POSTGRES_USER: mengxi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mengxi}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mengxi -d mengxi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
