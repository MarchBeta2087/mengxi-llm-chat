# 示例 SealedSecret（模板，勿直接提交真实值）。
#
# 生成方式：
#   NAMESPACE=mengxi \
#   MENGXI_SESSION_SECRET="$(openssl rand -base64 48)" \
#   MENGXI_MASTER_KEY_B64="<32B base64>" \
#   POSTGRES_PASSWORD="<强口令>" \
#   bash deploy/k8s/seal-secret.sh
#
# 说明：encryptedData 的密文与集群的 sealed-secrets 控制器密钥绑定，
#      更换集群后需重新生成。应用方式：kubectl apply -f <生成的 sealed-secret.yaml>
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mengxi-secrets
  namespace: mengxi
spec:
  encryptedData:
    MENGXI_SESSION_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
    MENGXI_MASTER_KEY_B64: REPLACE_WITH_KUBESEAL_OUTPUT
    POSTGRES_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: mengxi-secrets
      namespace: mengxi
    type: Opaque
