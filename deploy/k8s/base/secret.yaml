# ⚠️ 示例 Secret：请勿把真实值提交到仓库。
# 生产建议使用 Sealed Secrets / External Secrets / SOPS 注入。
# 注意：MENGXI_MASTER_KEY_B64 丢失会导致所有密文不可恢复，务必离线备份。
apiVersion: v1
kind: Secret
metadata:
  name: mengxi-secrets
type: Opaque
stringData:
  MENGXI_SESSION_SECRET: "change-me-to-a-long-random-value"
  MENGXI_MASTER_KEY_B64: "REPLACE_WITH_32B_BASE64"
  POSTGRES_PASSWORD: "change-me"
