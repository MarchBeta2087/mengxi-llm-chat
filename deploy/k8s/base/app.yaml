apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: mengxi-app
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mengxi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mengxi-app
  template:
    metadata:
      labels:
        app: mengxi-app
    spec:
      containers:
        - name: app
          image: ghcr.io/marchbeta2087/mengxi-llm-chat-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mengxi-config
            - secretRef:
                name: mengxi-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mengxi-data
