apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: mengxi-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mengxi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mengxi-web
  template:
    metadata:
      labels:
        app: mengxi-web
    spec:
      containers:
        - name: web
          image: ghcr.io/marchbeta2087/mengxi-llm-chat-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
