apiVersion: v1
kind: ConfigMap
metadata:
  name: mengxi-config
data:
  MENGXI_ENVIRONMENT: "production"
  MENGXI_DATA_DIR: "/data"
  MENGXI_KEK_PROFILE: "B"
  MENGXI_DATABASE_URL: "postgresql+asyncpg://mengxi:mengxi@postgres:5432/mengxi"
  MENGXI_REDIS_URL: "redis://redis:6379/0"
  MENGXI_FALLBACK_TO_PUBLIC: "true"
  MENGXI_ALLOW_ANONYMOUS: "false"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mengxi-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
