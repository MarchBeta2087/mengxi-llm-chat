# 需集群已安装 Ingress Controller（如 ingress-nginx）。
# TLS：推荐 cert-manager + ClusterIssuer 自动签发。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mengxi
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"      # SSE
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: mengxi.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
